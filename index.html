<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CV Sender</title>
<meta name="description" content="Envia candidatures personalitzades des del teu Gmail i fes-ne el seguiment · Send personalised job applications from your Gmail and track replies.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Layout: quatre passos en columna; el registre d'enviament imita una terminal */
:root{
  --bg:#f5f6f8; --surface:#fff; --ink:#151a24; --muted:#5c6475; --line:#e2e5ec; --soft:#eef2ff;
  --accent:#3a66ff; --accent-ink:#fff; --ok:#1f8a5b; --warn:#b7791f; --bad:#c2410c;
  --term-bg:#0f1218; --term-ink:#d7dce6;
  --display:"Instrument Serif", Georgia, serif; --body:"Geist", system-ui, sans-serif; --mono:"Geist Mono", ui-monospace, Menlo, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0d0f14; --surface:#151821; --ink:#eef0f5; --muted:#9aa2b3; --line:#262a36; --soft:#1b2140;
  --accent:#6f8dff; --accent-ink:#0d0f14; --ok:#3ccf8e; --warn:#e0a83a; --bad:#f07a4a; --term-bg:#07080b; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.5 var(--body)}
.wrap{max-width:1040px;margin:0 auto;padding:24px max(16px,env(safe-area-inset-right)) 60px max(16px,env(safe-area-inset-left))}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font:400 clamp(38px,7vw,60px)/1 var(--display);margin:0;letter-spacing:-.01em}
h1 em{color:var(--accent)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface);flex:0 0 auto}
.lang button{appearance:none;border:0;background:none;color:var(--muted);font:500 12.5px var(--mono);padding:5px 10px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.lede{color:var(--muted);max-width:62ch;margin:10px 0 0}
.step{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:18px}
.step h2{font:600 18px var(--body);margin:0 0 4px;display:flex;gap:10px;align-items:center}
.step h2 .n{font:500 13px var(--mono);color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:1px 9px}
.step p.h{color:var(--muted);margin:0 0 14px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:5px;flex:1 1 240px;min-width:0}
.field label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
input[type=text],input[type=number],textarea{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:9px 11px;font:14px/1.45 var(--body);width:100%}
textarea{min-height:150px;resize:vertical}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--muted);flex:1 1 240px;cursor:pointer}
.drop.on{border-color:var(--accent);color:var(--ink)}
.drop b{color:var(--ink)}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 16px;font:500 14px var(--body);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,.lang button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.summary{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.pill{font:500 12.5px var(--mono);border-radius:999px;padding:3px 10px;border:1px solid var(--line)}
.pill.ok{color:var(--ok);border-color:var(--ok)} .pill.warn{color:var(--warn);border-color:var(--warn)} .pill.bad{color:var(--bad);border-color:var(--bad)} .pill.acc{color:var(--accent);border-color:var(--accent)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:13.5px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--bg);position:sticky;top:0}
td.st{white-space:nowrap} td.num{font-family:var(--mono)}
.issue{display:block;font-size:12px}
.issue.warn{color:var(--warn)} .issue.bad{color:var(--bad)} .issue.ok{color:var(--ok)} .issue.mut{color:var(--muted)} .issue.acc{color:var(--accent)}
.term{background:var(--term-bg);color:var(--term-ink);font:13px/1.6 var(--mono);border-radius:12px;padding:14px;height:300px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.term .ok{color:#3ccf8e} .term .err{color:#f07a4a} .term .dim{color:#7c8496} .term .acc{color:#8aa2ff}
.bar{height:6px;background:var(--line);border-radius:999px;overflow:hidden;margin:12px 0}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.note{font-size:13px;color:var(--muted)}
details{margin-top:10px} summary{cursor:pointer;color:var(--accent)}
code{font-family:var(--mono);font-size:.92em;background:var(--soft);padding:1px 5px;border-radius:5px}
a{color:var(--accent)}
footer{color:var(--muted);font-size:13px;margin-top:28px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <h1>CV <em>Sender</em></h1>
      <div class="lang" role="group" aria-label="Idioma / Language">
        <button type="button" data-lang="ca">CA</button><button type="button" data-lang="es">ES</button><button type="button" data-lang="en">EN</button>
      </div>
    </div>
    <p class="lede" data-i18n="lede"></p>
  </header>

  <!-- 1 -->
  <section class="step" id="s1">
    <h2><span class="n">1</span> <span data-i18n="s1h"></span></h2>
    <p class="h" data-i18n-html="s1p"></p>
    <div class="row">
      <label class="drop" id="drop-csv" for="f-csv"><b data-i18n="csvB"></b><br><span id="csv-name" data-i18n="csvS"></span>
        <input id="f-csv" type="file" accept=".csv,text/csv" hidden></label>
      <label class="drop" id="drop-cv" for="f-cv"><b data-i18n="cvB"></b><br><span id="cv-name" data-i18n="cvS"></span>
        <input id="f-cv" type="file" accept="application/pdf" multiple hidden></label>
    </div>
    <details>
      <summary data-i18n="defSum"></summary>
      <p class="note" data-i18n-html="defNote"></p>
      <div class="field"><label for="d-subj" data-i18n="subjL"></label><input id="d-subj" type="text"></div>
      <div class="field" style="margin-top:10px"><label for="d-body" data-i18n="bodyL"></label><textarea id="d-body"></textarea></div>
    </details>
  </section>

  <!-- 2 -->
  <section class="step" id="s2">
    <h2><span class="n">2</span> <span data-i18n="s2h"></span></h2>
    <p class="h" data-i18n="s2p"></p>
    <div class="summary" id="summary"></div>
    <div class="tablewrap"><table>
      <thead><tr><th><input type="checkbox" id="all" checked></th><th data-i18n="thEmp"></th><th data-i18n="thMail"></th><th>CV</th><th data-i18n="thRev"></th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </section>

  <!-- 3 -->
  <section class="step" id="s3">
    <h2><span class="n">3</span> <span data-i18n="s3h"></span></h2>
    <p class="h" data-i18n-html="s3p"></p>
    <div class="row">
      <div class="field" style="flex:0 1 160px"><label for="delay" data-i18n="delayL"></label><input id="delay" type="number" min="5" max="600" value="30"></div>
      <label style="display:flex;gap:8px;align-items:center;flex:0 0 auto;padding-bottom:10px"><input id="dry" type="checkbox" checked> <span data-i18n="dryL"></span></label>
      <button class="btn" id="btn-login" type="button"></button>
      <button class="btn primary" id="btn-send" type="button" disabled></button>
      <button class="btn" id="btn-stop" type="button" disabled data-i18n="stop"></button>
    </div>
    <div class="bar" aria-hidden="true"><i id="bar"></i></div>
    <div class="term" id="term" role="log" aria-live="polite"></div>
    <div class="row" style="margin-top:12px"><button class="btn" id="btn-export" type="button" disabled data-i18n="export"></button></div>
    <details>
      <summary data-i18n="gSum"></summary>
      <p class="note" data-i18n-html="gNote"></p>
      <div class="field"><label for="client-id">Client ID</label><input id="client-id" type="text" placeholder="xxxxxxxx.apps.googleusercontent.com"></div>
    </details>
  </section>

  <!-- 4 -->
  <section class="step" id="s4">
    <h2><span class="n">4</span> <span data-i18n="s4h"></span></h2>
    <p class="h" data-i18n="s4p"></p>
    <div class="row" style="margin-bottom:12px">
      <button class="btn primary" id="btn-check" type="button" data-i18n="check"></button>
      <button class="btn" id="btn-hexport" type="button" data-i18n="hExport"></button>
      <label class="btn" for="f-hist" style="margin:0"><span data-i18n="hImport"></span><input id="f-hist" type="file" accept=".csv,text/csv" hidden></label>
      <button class="btn" id="btn-hclear" type="button" data-i18n="hClear"></button>
    </div>
    <div class="summary" id="hsummary"></div>
    <div class="tablewrap"><table>
      <thead><tr><th data-i18n="thEmp"></th><th data-i18n="thMail"></th><th data-i18n="thSent"></th><th data-i18n="thStatus"></th><th data-i18n="thReplies"></th><th data-i18n="thLast"></th><th></th></tr></thead>
      <tbody id="hrows"></tbody>
    </table></div>
    <p class="note" data-i18n="readNote" style="margin-top:12px"></p>
  </section>

  <footer data-i18n-html="footer"></footer>
</div>

<script src="papaparse.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };
let lang = store.get("cvsender.lang") || ({ca:"ca",es:"es"}[(navigator.language||"").slice(0,2)] || "en");
const t = (k, v={}) => (T[lang][k] ?? T.ca[k] ?? k).replace(/\{(\w+)\}/g, (m,x) => x in v ? v[x] : m);
let rows = [], cvFiles = {}, token = null, tokenExp = 0, tokenClient = null, pendingCb = null, stopFlag = false, sending = false, results = [];
let hist = []; try { hist = JSON.parse(store.get("cvsender.history") || "[]"); } catch(e){ hist = []; }
const saveHist = () => store.set("cvsender.history", JSON.stringify(hist));

/* ===== Idioma ===== */
function applyLang(newLang){
  const oldSubj = $("#d-subj").value, oldBody = $("#d-body").value;
  const isDefault = !oldSubj || Object.values(T).some(L => L.defSubj === oldSubj && L.defBody === oldBody);
  lang = newLang; store.set("cvsender.lang", lang); document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => { if (!el.dataset.fixed) el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-html]").forEach(el => el.innerHTML = t(el.dataset.i18nHtml));
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  $("#all").setAttribute("aria-label", t("pSel", {n:""}).trim());
  if (isDefault){ $("#d-subj").value = t("defSubj"); $("#d-body").value = t("defBody"); }
  $("#btn-login").textContent = token ? t("logged") : t("login");
  renderRows(); renderHist(); updateButtons();
}
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => applyLang(b.dataset.lang)));

/* ===== Registre tipus terminal ===== */
function log(msg, cls=""){ const el=$("#term"); const time=new Date().toLocaleTimeString(); el.insertAdjacentHTML("beforeend", `<span class="dim">[${time}]</span> <span class="${cls}">${esc(msg)}</span>\n`); el.scrollTop=el.scrollHeight; }

/* ===== 1. Pujar fitxers ===== */
function pick(keys){ return r => { for (const k of Object.keys(r)) if (keys.includes(k.trim().toLowerCase())) return (r[k]||"").trim(); return ""; }; }
const getEmpresa = pick(["empresa","company","nom","name","nombre"]);
const getEmail = pick(["email","correu","correo","mail","e-mail"]);
const getSubj = pick(["assumpte","asunto","subject"]);
const getBody = pick(["missatge","mensaje","message","cos","body","texto"]);
const getCv = pick(["cv","fitxer","archivo","file","adjunt","attachment"]);
function fill(tpl, r){ return tpl.replace(/\{([^}]+)\}/g, (m,k) => { const key=Object.keys(r).find(x=>x.trim().toLowerCase()===k.trim().toLowerCase()); return key ? r[key] : (["empresa","company"].includes(k.toLowerCase()) ? getEmpresa(r) : m); }); }

function loadCsv(file){
  const n = $("#csv-name"); n.textContent = file.name; n.dataset.fixed = 1;
  Papa.parse(file, {header:true, skipEmptyLines:true, complete: res => {
    rows = res.data.map((r,i) => ({i, raw:r, empresa:getEmpresa(r), email:(getEmail(r).match(/[^\s<>(),;]+@[^\s<>(),;]+/)||[""])[0], subj:getSubj(r), body:getBody(r), cv:getCv(r), on:true}));
    log(t("lCsv", {f:file.name, n:rows.length}), "acc");
    validate();
  }, error: e => log(t("lCsvErr", {e:e.message}), "err")});
}
function loadCvs(files){
  for (const f of files) cvFiles[f.name] = f;
  const n = $("#cv-name"); n.textContent = Object.keys(cvFiles).join(", "); n.dataset.fixed = 1;
  log(t("lCvs", {n:files.length}), "acc");
  validate();
}
$("#f-csv").addEventListener("change", e => e.target.files[0] && loadCsv(e.target.files[0]));
$("#f-cv").addEventListener("change", e => loadCvs(e.target.files));
for (const [id, fn] of [["#drop-csv", f => f[0] && loadCsv(f[0])], ["#drop-cv", f => loadCvs(f)]]) {
  const d = $(id);
  d.addEventListener("dragover", e => { e.preventDefault(); d.classList.add("on"); });
  d.addEventListener("dragleave", () => d.classList.remove("on"));
  d.addEventListener("drop", e => { e.preventDefault(); d.classList.remove("on"); fn(e.dataTransfer.files); });
}

/* ===== 2. Revisió ===== */
function cvFor(r){ if (r.cv && cvFiles[r.cv]) return cvFiles[r.cv]; if (r.cv) return null; const names=Object.keys(cvFiles); return names.length ? cvFiles[names[0]] : null; }
function validate(){
  const seen = {};
  rows.forEach(r => { r.issues = []; r.level = "ok";
    if (!r.empresa) r.issues.push(["warn","iNoEmp"]);
    if (!r.email) r.issues.push(["bad","iNoMail"]);
    else if (!EMAIL_RE.test(r.email)) r.issues.push(["bad","iBadMail"]);
    else { const k=r.email.toLowerCase(); if (seen[k]) r.issues.push(["warn","iDup",{n:seen[k]}]); else seen[k]=r.i+2;
      if (GENERIC.test(r.email)) r.issues.push(["warn","iGen"]); }
    const cv = cvFor(r);
    if (!cv) r.issues.push(["bad", r.cv ? "iNoCvF" : "iNoCv", {f:r.cv}]);
    else if (cv.size > 20*1024*1024) r.issues.push(["bad","iBig"]);
    if (r.issues.some(x=>x[0]==="bad")) { r.level="bad"; r.on=false; r.auto=true; }
    else { if (r.auto){ r.on=true; r.auto=false; } if (r.issues.length) r.level="warn"; }
  });
  renderRows();
}
function renderRows(){
  const tb = $("#rows");
  if (!rows.length){ tb.innerHTML = `<tr><td colspan="5" class="note">${esc(t("rowsEmpty"))}</td></tr>`; $("#summary").innerHTML = `<span class="pill">${esc(t("noCsv"))}</span>`; updateButtons(); return; }
  tb.innerHTML = rows.map(r => `<tr><td><input type="checkbox" data-i="${r.i}" ${r.on?"checked":""} ${r.level==="bad"?"disabled":""} aria-label="${esc(r.empresa)}"></td>
    <td>${esc(r.empresa||"—")}</td><td>${esc(r.email||"—")}</td><td>${esc(cvFor(r)?.name||"—")}</td>
    <td class="st">${r.issues.length ? r.issues.map(([l,k,v])=>`<span class="issue ${l}">${l==="bad"?"✕":"!"} ${esc(t(k,v))}</span>`).join("") : `<span class="issue ok">✓ ${esc(t("iOk"))}</span>`}</td></tr>`).join("");
  const c = l => rows.filter(r=>r.level===l).length, sel=rows.filter(r=>r.on).length;
  $("#summary").innerHTML = `<span class="pill">${t("pRows",{n:rows.length})}</span><span class="pill ok">${t("pOk",{n:c("ok")})}</span><span class="pill warn">${t("pWarn",{n:c("warn")})}</span><span class="pill bad">${t("pBad",{n:c("bad")})}</span><span class="pill">${t("pSel",{n:sel})}</span>`;
  updateButtons();
}
$("#rows").addEventListener("change", e => { const i=e.target.dataset.i; if (i!==undefined){ rows[+i].on = e.target.checked; renderRows(); } });
$("#all").addEventListener("change", e => { rows.forEach(r => { if (r.level!=="bad") r.on = e.target.checked; }); renderRows(); });

/* ===== Google ===== */
function clientId(){ return $("#client-id").value.trim() || DEFAULT_CLIENT_ID; }
$("#client-id").value = store.get("cvsender.clientId") || "";
$("#client-id").addEventListener("change", () => { store.set("cvsender.clientId", $("#client-id").value.trim()); tokenClient = null; });
function ensureToken(cb){
  if (token && Date.now() < tokenExp) return cb();
  if (!clientId()){ log(t("lNoCid"), "err"); $("#s3 details").open = true; return; }
  if (!window.google?.accounts?.oauth2){ log(t("lNoGsi"), "err"); return; }
  if (!tokenClient) tokenClient = google.accounts.oauth2.initTokenClient({ client_id: clientId(), scope: SCOPES,
    callback: resp => { if (resp.error){ log(t("lCancel", {e:resp.error}), "err"); pendingCb = null; return; }
      token = resp.access_token; tokenExp = Date.now() + ((resp.expires_in||3600) - 60) * 1000;
      log(t("lLogged"), "ok"); $("#btn-login").textContent = t("logged"); updateButtons();
      const f = pendingCb; pendingCb = null; f && f(); } });
  pendingCb = cb; tokenClient.requestAccessToken();
}
$("#btn-login").addEventListener("click", () => ensureToken(() => { $("#dry").checked = false; updateButtons(); }));

/* ===== 3. Enviament ===== */
$("#dry").addEventListener("change", updateButtons);
function updateButtons(){
  const sel = rows.filter(r=>r.on).length, dry = $("#dry").checked;
  $("#btn-send").disabled = sending || !sel || (!dry && !token);
  $("#btn-send").textContent = dry ? t("sendDry",{n:sel}) : t("send",{n:sel});
  $("#btn-stop").disabled = !sending;
  $("#btn-check").disabled = sending || !hist.length;
}
const b64 = s => btoa(unescape(encodeURIComponent(s)));
const fileB64 = f => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result.split(",")[1]); fr.onerror = rej; fr.readAsDataURL(f); });
async function buildRaw(r, cv){
  const boundary = "cvsender_" + Math.random().toString(36).slice(2);
  const subj = fill(r.subj || $("#d-subj").value, r.raw), body = fill(r.body || $("#d-body").value, r.raw);
  const att = (await fileB64(cv)).replace(/.{76}/g, "$&\r\n");
  const mime = [
    `To: ${r.email}`, `Subject: =?UTF-8?B?${b64(subj)}?=`, "MIME-Version: 1.0", `Content-Type: multipart/mixed; boundary="${boundary}"`, "",
    `--${boundary}`, "Content-Type: text/plain; charset=UTF-8", "Content-Transfer-Encoding: base64", "", b64(body).replace(/.{76}/g, "$&\r\n"), "",
    `--${boundary}`, `Content-Type: application/pdf; name="=?UTF-8?B?${b64(cv.name)}?="`, `Content-Disposition: attachment; filename="=?UTF-8?B?${b64(cv.name)}?="`, "Content-Transfer-Encoding: base64", "", att, "",
    `--${boundary}--`].join("\r\n");
  return {raw: b64(mime).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""), subj};
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
$("#btn-stop").addEventListener("click", () => { stopFlag = true; log(t("lStopping"), "err"); });
$("#btn-send").addEventListener("click", async () => {
  const list = rows.filter(r => r.on), dry = $("#dry").checked, delay = Math.max(5, +$("#delay").value || 30) * 1000;
  sending = true; stopFlag = false; results = []; updateButtons();
  log((dry ? t("lDryTag") : "") + t("lStart", {n:list.length, s:delay/1000}), "acc");
  for (let k = 0; k < list.length; k++){
    if (stopFlag) break;
    const r = list[k], cv = cvFor(r);
    log(`[${k+1}/${list.length}] ${r.empresa} → ${r.email} (${cv.name})`);
    try {
      const {raw, subj} = await buildRaw(r, cv);
      let sent = {};
      if (!dry){
        const res = await fetch("https://gmail.googleapis.com/gmail/v1/users/me/messages/send", {method:"POST", headers:{Authorization:`Bearer ${token}`, "Content-Type":"application/json"}, body: JSON.stringify({raw})});
        if (!res.ok){ const tx = await res.text(); const err = new Error(res.status === 401 ? t("lExpired") : t("lGmail", {s:res.status, t:tx.slice(0,160)})); err.fatal = res.status === 401; throw err; }
        sent = await res.json();
        hist.unshift({id:sent.id, threadId:sent.threadId, empresa:r.empresa, email:r.email, subj, sent:new Date().toISOString(), status:"pending", replies:0, last:null});
        saveHist(); renderHist();
      }
      log(`    ${dry ? t("lOkDry") : t("lOk")} · «${subj}»`, "ok");
      results.push({...r.raw, estat: dry ? "test" : "sent", data: new Date().toISOString(), id: sent.id||"", threadId: sent.threadId||""});
    } catch(e){
      log("    " + t("lErr", {e:e.message}), "err");
      results.push({...r.raw, estat: "error: " + e.message, data: new Date().toISOString(), id:"", threadId:""});
      if (e.fatal){ token = null; $("#btn-login").textContent = t("login"); break; }
    }
    $("#bar").style.width = ((k+1)/list.length*100) + "%";
    if (k < list.length-1 && !stopFlag && !dry) { log("    " + t("lWait", {s:delay/1000}), "dim"); await sleep(delay); }
  }
  const okN = results.filter(x=>x.estat==="sent"||x.estat==="test").length;
  log(dry ? t("lDoneDry", {k:okN, n:list.length}) : t("lDone", {k:okN, n:list.length}), "acc");
  sending = false; $("#btn-export").disabled = !results.length; updateButtons();
});
function download(name, data){ const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["﻿" + data], {type:"text/csv"})); a.download = name; a.click(); }
$("#btn-export").addEventListener("click", () => download("resultat_enviament.csv", Papa.unparse(results)));

/* ===== 4. Seguiment ===== */
const fmtDate = iso => iso ? new Date(iso).toLocaleDateString(lang, {day:"numeric", month:"short", year:"numeric"}) : "—";
const daysSince = iso => Math.floor((Date.now() - new Date(iso)) / 864e5);
function statusHtml(h){
  if (h.status === "replied") return `<span class="issue ok">✓ ${esc(t("stReplied"))}</span>`;
  if (h.status === "bounced") return `<span class="issue bad">✕ ${esc(t("stBounced"))}</span>`;
  if (h.status === "error") return `<span class="issue bad">! ${esc(t("stErr"))}</span>`;
  if (h.status === "none"){ const d = daysSince(h.sent);
    return `<span class="issue mut">${esc(t("stNone"))}</span>` + (d >= FOLLOW_DAYS ? `<span class="issue warn">! ${esc(t("stFollow",{d}))}</span>` : ""); }
  return `<span class="issue mut">${esc(t("stPending"))}</span>`;
}
function renderHist(){
  const tb = $("#hrows");
  if (!hist.length){ tb.innerHTML = `<tr><td colspan="7" class="note">${esc(t("hEmpty"))}</td></tr>`; $("#hsummary").innerHTML = ""; updateButtons(); return; }
  tb.innerHTML = hist.map(h => `<tr><td>${esc(h.empresa||"—")}</td><td>${esc(h.email)}</td><td class="num">${fmtDate(h.sent)}</td><td class="st">${statusHtml(h)}</td>
    <td class="num">${h.replies||0}</td><td class="num">${fmtDate(h.last)}</td>
    <td>${h.threadId ? `<a href="https://mail.google.com/mail/u/0/#all/${encodeURIComponent(h.threadId)}" target="_blank" rel="noopener">${esc(t("open"))}</a>` : ""}</td></tr>`).join("");
  const n = s => hist.filter(h => h.status === s).length, rep = n("replied");
  const checkedAt = hist.map(h=>h.checked).filter(Boolean).sort().pop();
  $("#hsummary").innerHTML = `<span class="pill">${t("hTotal",{n:hist.length})}</span><span class="pill ok">${t("hRep",{n:rep})}</span><span class="pill">${t("hNone",{n:n("none")})}</span><span class="pill bad">${t("hBounce",{n:n("bounced")})}</span><span class="pill acc">${t("hRate",{n:Math.round(rep/hist.length*100)})}</span>`
    + (checkedAt ? `<span class="pill">${t("checkedAt",{t:new Date(checkedAt).toLocaleString(lang,{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})})}</span>` : "");
  updateButtons();
}
async function checkReplies(){
  const list = hist.filter(h => h.threadId);
  $("#btn-check").disabled = true; log(t("lCheck", {n:list.length}), "acc");
  for (const h of list){
    try {
      const res = await fetch(`https://gmail.googleapis.com/gmail/v1/users/me/threads/${encodeURIComponent(h.threadId)}?format=metadata&metadataHeaders=From`, {headers:{Authorization:`Bearer ${token}`}});
      if (res.status === 401){ token = null; log(t("lExpired"), "err"); break; }
      if (res.status === 403){ log(t("lNoScope"), "err"); token = null; tokenClient = null; break; }
      if (res.status === 404){ h.status = "error"; continue; }
      if (!res.ok) throw new Error(res.status);
      const th = await res.json();
      const others = (th.messages||[]).filter(m => m.id !== h.id && !(m.labelIds||[]).includes("SENT"));
      const from = m => ((m.payload?.headers||[]).find(x => x.name.toLowerCase() === "from")?.value || "");
      const bounces = others.filter(m => /mailer-daemon|postmaster|mail delivery/i.test(from(m)));
      const replies = others.filter(m => !bounces.includes(m));
      h.replies = replies.length;
      h.last = replies.length ? new Date(Math.max(...replies.map(m => +m.internalDate))).toISOString() : null;
      h.status = replies.length ? "replied" : bounces.length ? "bounced" : "none";
      h.checked = new Date().toISOString();
    } catch(e){ log(t("lErr", {e:`${h.empresa}: ${e.message}`}), "err"); }
    await sleep(120);
  }
  saveHist(); renderHist();
  const n = s => hist.filter(h => h.status === s).length;
  log(t("lChecked", {r:n("replied"), b:n("bounced"), x:n("none")}), "ok");
}
$("#btn-check").addEventListener("click", () => ensureToken(checkReplies));
$("#btn-hexport").addEventListener("click", () => download("seguiment_candidatures.csv", Papa.unparse(hist.map(h => ({empresa:h.empresa, email:h.email, assumpte:h.subj, enviat:h.sent, estat:h.status, respostes:h.replies, ultima_resposta:h.last||"", id:h.id, threadId:h.threadId})))));
$("#btn-hclear").addEventListener("click", () => { if (confirm(t("hConfirm"))){ hist = []; saveHist(); renderHist(); } });
$("#f-hist").addEventListener("change", e => { const f = e.target.files[0]; if (!f) return;
  Papa.parse(f, {header:true, skipEmptyLines:true, complete: res => {
    const known = new Set(hist.map(h => h.threadId)); let added = 0;
    for (const r of res.data){ const tid = (r.threadId||"").trim(); if (!tid || known.has(tid)) continue;
      const st = (r.estat||"").trim();
      hist.push({id:(r.id||"").trim(), threadId:tid, empresa:getEmpresa(r), email:getEmail(r), subj:r.assumpte||getSubj(r), sent:r.enviat||r.data||new Date().toISOString(),
        status:["replied","none","bounced","error"].includes(st) ? st : "pending", replies:+r.respostes||0, last:r.ultima_resposta||null}); known.add(tid); added++; }
    if (!res.meta.fields?.includes("threadId")) log(t("lImpNone"), "err"); else log(t("lImported", {n:added}), "acc");
    hist.sort((a,b) => (b.sent||"").localeCompare(a.sent||"")); saveHist(); renderHist(); e.target.value = "";
  }});
});

/* ===== Inici ===== */
applyLang(lang);
log(t("lReady"), "dim");
</script>
